name: AI Financial Analyst

on:
  workflow_dispatch:
  schedule:
    # 10:00 Heure Suisse (CEST) = 08:00 UTC
    - cron: '0 8 * * *'
    # 19:45 Heure Suisse (CEST) = 17:45 UTC
    - cron: '45 17 * * *'

permissions:
  contents: write

jobs:
  analyze_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        
      - name: Configurer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installer les dépendances Python
        run: pip install -r requirements.txt
        
      - name: Exécuter l'analyseur IA (Script Python)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze.py
        
      - name: Sauvegarder les résultats sur GitHub
        run: |
          git config --global user.name "AI Analyst Bot"
          git config --global user.email "bot@example.com"
          git add data.json
          git commit -m "Mise à jour automatique de l'analyse IA" || echo "Aucun changement à commiter"
          git push
