name: AI Financial Analyst

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '45 17 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        
      - name: Configurer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installer les dépendances Python
        run: pip install -r requirements.txt
        
      - name: Exécuter l'analyseur IA (Script Python)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze.py
        
      - name: Sauvegarder les résultats (JSON)
        run: |
          git config --global user.name "AI Analyst Bot"
          git config --global user.email "bot@example.com"
          git add data.json
          git commit -m "Mise à jour automatique de l'analyse IA" || echo "Aucun changement à commiter"
          git push

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Préparer les fichiers pour le web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Déployer le site web
        id: deployment
        uses: actions/deploy-pages@v4
