name: Portfolio Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7,13,19 * * *'
  push:
    branches: ["main"]
    paths:
      - "portfolio_intelligence.py"
      - "catalyst_radar.py"
      - "research_config.json"
      - "index.html"
      - "radar.html"
      - "portfolio.json"
      - "watchlist.json"
      - "requirements.txt"
      - ".github/workflows/portfolio_intelligence.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-intelligence-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Validate code
        run: |
          python -m py_compile portfolio_intelligence.py catalyst_radar.py
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ("index.html", "radar.html"):
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              out = Path("/tmp") / (Path(name).stem + "-inline.js")
              out.write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/radar-inline.js

      - name: Build portfolio data
        run: python portfolio_intelligence.py

      - name: Build Catalyst Radar
        env:
          ENABLE_GEMINI_FREE: "0"
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python catalyst_radar.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          radar = json.loads(Path("radar.json").read_text(encoding="utf-8"))

          assert data.get("schema_version") == 4
          assert "portfolio" in data
          assert radar.get("schema_version") == 1
          assert radar.get("theme", {}).get("id") == "robotics"
          assert isinstance(radar.get("companies"), list)
          assert isinstance(radar.get("signals"), list)

          print("Portfolio status:", data.get("status"))
          print("Positions:", len(data.get("portfolio", {}).get("positions", [])))
          print("Radar companies:", len(radar.get("companies", [])))
          print("Radar signals:", len(radar.get("signals", [])))
          print("Radar discoveries:", len(radar.get("discovery", [])))
          print("Radar warnings:", len(radar.get("errors", [])))
          print("Gemini:", radar.get("ai", {}).get("status"))
          PY

      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp radar.html site/radar.html
          cp data.json site/data.json
          cp radar.json site/radar.json
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
