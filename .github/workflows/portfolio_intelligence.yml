name: Portfolio Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7,13,19 * * *'
  push:
    branches: ["main"]
    paths:
      - "portfolio_intelligence.py"
      - "catalyst_radar.py"
      - "research_os.py"
      - "company_lab.py"
      - "research_config.json"
      - "index.html"
      - "company.html"
      - "radar.html"
      - "research.html"
      - "portfolio.json"
      - "watchlist.json"
      - "requirements.txt"
      - ".github/workflows/portfolio_intelligence.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-intelligence-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Restore Research OS memory
        uses: actions/cache/restore@v4
        with:
          path: .research_state
          key: research-state-${{ github.run_id }}
          restore-keys: |
            research-state-

      - name: Restore Company Lab cache
        uses: actions/cache/restore@v4
        with:
          path: .company_state
          key: company-lab-${{ github.run_id }}
          restore-keys: |
            company-lab-

      - name: Validate code
        run: |
          python -m py_compile portfolio_intelligence.py catalyst_radar.py research_os.py company_lab.py
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ("index.html", "company.html", "radar.html", "research.html"):
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              out = Path("/tmp") / (Path(name).stem + "-inline.js")
              out.write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/company-inline.js
          node --check /tmp/radar-inline.js
          node --check /tmp/research-inline.js

      - name: Build portfolio data
        run: python portfolio_intelligence.py

      - name: Build Company Lab
        run: python company_lab.py

      - name: Build Catalyst Radar
        env:
          ENABLE_GEMINI_FREE: "0"
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python catalyst_radar.py

      - name: Build Research OS
        run: python research_os.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          radar = json.loads(Path("radar.json").read_text(encoding="utf-8"))
          research = json.loads(Path("research.json").read_text(encoding="utf-8"))
          company = json.loads(Path("company_data.json").read_text(encoding="utf-8"))
          watchlist = json.loads(Path("watchlist.json").read_text(encoding="utf-8"))

          assert data.get("schema_version") == 4
          assert "portfolio" in data

          assert radar.get("schema_version") == 2
          assert radar.get("theme", {}).get("id") == "robotics"
          assert isinstance(radar.get("companies"), list)
          assert isinstance(radar.get("signals"), list)
          assert isinstance(radar.get("provider_status"), dict)
          assert len(radar.get("companies", [])) >= 30, "Radar fallback/empty company universe"
          assert len(radar.get("signals", [])) + len(radar.get("discovery", [])) >= 10, "Radar has no usable research data"
          assert radar.get("provider_status", {}).get("sec", {}).get("mapping_request_removed") is True, "SEC ticker-map dependency returned"

          assert research.get("schema_version") == 1
          assert isinstance(research.get("changes"), list)
          assert isinstance(research.get("evidence_packs"), list)
          assert isinstance(research.get("themes"), list)
          assert isinstance(research.get("dossiers"), list)
          assert len(research.get("dossiers", [])) >= 30, "Research OS company dossiers missing"
          assert research.get("knowledge_graph", {}).get("nodes"), "Knowledge graph empty"

          assert company.get("schema_version") == 1
          assert isinstance(company.get("dossiers"), list)
          expected_tickers = [
              str(item.get("ticker") or "").strip().upper()
              for item in watchlist.get("items", [])
              if str(item.get("ticker") or "").strip()
              and not str(item.get("ticker") or "").strip().upper().startswith("CASH")
          ]
          expected_tickers = list(dict.fromkeys(expected_tickers))[:100]
          actual_tickers = [item.get("ticker") for item in company.get("dossiers", [])]
          assert actual_tickers == expected_tickers, "Company Lab does not cover the full configured universe"
          assert all("ticker" in item for item in company.get("dossiers", []))

          print("Portfolio status:", data.get("status"))
          print("Positions:", len(data.get("portfolio", {}).get("positions", [])))
          print("Radar companies:", len(radar.get("companies", [])))
          print("Radar signals:", len(radar.get("signals", [])))
          print("Radar discoveries:", len(radar.get("discovery", [])))
          print("GDELT status:", radar.get("provider_status", {}).get("gdelt", {}).get("status"))
          print("SEC status:", radar.get("provider_status", {}).get("sec", {}).get("status"))
          print("Google RSS status:", radar.get("provider_status", {}).get("google_news", {}).get("status"))
          print("Served previous success:", radar.get("served_from_previous_success"))
          print("Research changes:", len(research.get("changes", [])))
          print("Evidence packs:", len(research.get("evidence_packs", [])))
          print("Research memory runs:", research.get("memory", {}).get("historical_run_count"))
          print("Unknown candidates:", len(research.get("unknown_candidates", [])))
          print("Gemini:", radar.get("ai", {}).get("status"))
          print("Company Lab dossiers:", company.get("available_count"), "/", company.get("universe_count"))
          print("Company Lab cache:", company.get("cached_count"))
          PY

      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp company.html site/company.html
          cp radar.html site/radar.html
          cp research.html site/research.html
          cp data.json site/data.json
          cp company_data.json site/company_data.json
          cp radar.json site/radar.json
          cp research.json site/research.json
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Save Research OS memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .research_state
          key: research-state-${{ github.run_id }}

      - name: Save Company Lab cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .company_state
          key: company-lab-${{ github.run_id }}
